# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
# Development environment only. The published mod deliberately declares no Fabric Loader
# dependency, so the loader version in use is whatever Client Commands requires
# (Client Commands 2.16.4 bundles libraries that need >= 0.19.5).
loader_version=0.20.1
loom_version=1.17-SNAPSHOT
# Fabric API is only needed by the dev runtime (Client Commands requires it); it is not a dependency of this mod
fabric_version=0.166.0+26.3

# Mod Properties
mod_version=1.2
maven_group=me.znianxgang.ccbypass
